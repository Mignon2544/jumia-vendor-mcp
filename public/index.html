<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wizo Seller Hub</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { background-color: #ff9900; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-left: 10px; transition: 0.2s;}
        .btn:hover { background-color: #e68a00; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #c82333; }
        .btn-success { background-color: #28a745; }
        .btn-success:hover { background-color: #218838; }
        
        .section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Search Bar Styles */
        .search-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .search-bar input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; min-width: 200px; }
        .search-bar select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; background: white; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; vertical-align: middle; }
        th { background-color: #f8f9fa; color: #333; }
        tr:hover { background-color: #f1f1f1; cursor: pointer; }
        
        .product-img { width: 50px; height: 50px; object-fit: cover; border-radius: 5px; border: 1px solid #eee; }
        
        .badge-active { background: #e6f4ea; color: #1e8e3e; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-inactive { background: #fce8e6; color: #d93025; padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        
        .pagination { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }

        /* Modal Styles */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 800px; border-radius: 10px; padding: 20px; max-height: 90vh; overflow-y: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.3); position: relative;}
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #aaa; }
        .close-btn:hover { color: #333; }
        
        .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        @media (max-width: 600px) { .modal-grid { grid-template-columns: 1fr; } }
        
        .image-gallery { display: flex; flex-wrap: wrap; gap: 10px; }
        .image-gallery img { width: 100px; height: 100px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd; cursor: pointer; }
        .image-gallery img:hover { transform: scale(1.05); }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        .alert-box { padding: 10px; border-radius: 5px; margin-bottom: 15px; display: none; }
        .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛒 Wizo Seller Hub</h1>
        <div>
            <button class="btn" onclick="loadShops()">Refresh Shops</button>
            <button class="btn" onclick="loadProducts()">Load All Products</button>
        </div>
    </div>

    <div id="status-message" style="color: red; font-weight: bold; margin-bottom: 10px;"></div>
    
    <!-- Shops Section -->
    <div class="section">
        <h2>My Shops</h2>
        <div id="shops-container">Loading...</div>
    </div>

    <!-- Products Section -->
    <div class="section" id="products-section" style="display: none;">
        <h2>Products</h2>
        
        <!-- Search Bar -->
        <div class="search-bar">
            <select id="search-type">
                <option value="name">Search by Name</option>
                <option value="sku">Search by SKU</option>
            </select>
            <input type="text" id="search-input" placeholder="Enter search term..." onkeypress="handleSearchEnter(event)">
            <button class="btn" onclick="loadProducts()">Search</button>
            <button class="btn" style="background-color: #6c757d;" onclick="clearFilters()">Clear</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">Image</th>
                    <th>Product Name</th>
                    <th>Seller SKU</th>
                    <th>Price</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="products-body">
                <!-- Products will load here -->
            </tbody>
        </table>
        
        <!-- Pagination Controls -->
        <div class="pagination">
            <button class="btn" id="btn-prev" onclick="prevPage()" disabled>⬅️ Previous</button>
            <span id="page-indicator">Page 1</span>
            <button class="btn" id="btn-next" onclick="nextPage()" disabled>Next ➡️</button>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            
            <h2 id="modal-title">Product Details</h2>
            
            <div id="modal-alert" class="alert-box"></div>

            <div class="modal-grid">
                <!-- Left Side: Image Gallery & Basic Info -->
                <div>
                    <h3>Images</h3>
                    <div class="image-gallery" id="modal-images">
                        <!-- Images injected here -->
                    </div>
                    
                    <h3 style="margin-top: 20px;">Raw Data</h3>
                    <p style="font-size: 12px; color: #666; word-break: break-all;"><strong>Product SID:</strong> <span id="modal-sid"></span></p>
                    <p style="font-size: 12px; color: #666; word-break: break-all;"><strong>Variation SID:</strong> <span id="modal-variation-sid"></span></p>
                </div>

                <!-- Right Side: Edit Form -->
                <div>
                    <h3>Edit Product</h3>
                    
                    <div class="form-group">
                        <label>Status</label>
                        <select id="edit-status">
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Price (<span id="edit-currency-label"></span>)</label>
                        <input type="number" id="edit-price" step="0.01">
                    </div>

                    <div class="form-group">
                        <label>Stock (Quantity)</label>
                        <input type="number" id="edit-stock">
                    </div>

                    <div style="display: flex; gap: 10px; margin-top: 20px;">
                        <button class="btn btn-success" onclick="saveChanges()" style="flex: 1;">💾 Save Changes</button>
                        <button class="btn btn-danger" onclick="closeModal()" style="flex: 1;">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_TOKEN = prompt("Please enter your MCP_API_TOKEN:");
        if(!API_TOKEN) alert("You need the token to view data!");

        let currentPage = 1;
        let nextTokens = []; 
        let currentProductData = null; // Stores the product currently open in the modal

        async function loadShops() {
            const container = document.getElementById('shops-container');
            const statusMsg = document.getElementById('status-message');
            container.innerHTML = 'Loading shops...';
            statusMsg.innerHTML = '';

            try {
                const response = await fetch('/api/shops', { headers: { 'Authorization': `Bearer ${API_TOKEN}` } });
                if (!response.ok) throw new Error("Unauthorized or Server Error");
                const data = await response.json();
                
                container.innerHTML = ''; 
                if (data.length === 0) { container.innerHTML = '<p>No shops found.</p>'; return; }

                data.forEach(shop => {
                    container.innerHTML += `
                        <div style="border: 1px solid #ddd; padding: 10px; border-radius: 5px; margin-bottom: 10px;">
                            <h3 style="margin:0 0 5px 0;">${shop.name || shop.shopName || 'Unnamed Shop'}</h3>
                            <p style="margin:0; font-size:14px; color:#555;"><strong>Shop ID:</strong> ${shop.id || shop.shopId}</p>
                        </div>
                    `;
                });
            } catch (error) {
                container.innerHTML = '';
                statusMsg.innerHTML = `Error: ${error.message}`;
            }
        }

        async function fetchProductsPage(token = null) {
            const section = document.getElementById('products-section');
            const tbody = document.getElementById('products-body');
            const statusMsg = document.getElementById('status-message');
            
            section.style.display = 'block';
            tbody.innerHTML = '<tr><td colspan="5">Loading products...</td></tr>';
            statusMsg.innerHTML = '';

            const searchQuery = document.getElementById('search-input').value.trim();
            const searchType = document.getElementById('search-type').value;

            let url = `/api/products?type=${searchType}`;
            if (token) url += `&token=${encodeURIComponent(token)}`;
            if (searchQuery) url += `&search=${encodeURIComponent(searchQuery)}`;

            try {
                const response = await fetch(url, { headers: { 'Authorization': `Bearer ${API_TOKEN}` } });
                if (!response.ok) throw new Error("Failed to load products");
                
                let data = await response.json();
                
                tbody.innerHTML = ''; 
                let products = data.products || [];

                if (searchQuery && searchType === "name") {
                    products = products.filter(p => (p.name || "").toLowerCase().includes(searchQuery.toLowerCase()));
                }

                updatePaginationUI(data);

                if (products.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5">No products found matching your search.</td></tr>';
                    return;
                }

                // Save all products globally so we can easily grab them when a row is clicked
                window.allProducts = products;

                products.forEach((product, index) => {
                    const variation = product.variations && product.variations[0] ? product.variations[0] : {};
                    const bc = variation.businessClients && variation.businessClients[0] ? variation.businessClients[0] : {};
                    
                    const price = variation.globalPrice ? `${variation.globalPrice.value} ${variation.globalPrice.currency}` : 'N/A';
                    const status = bc.status || 'UNKNOWN';
                    const statusBadge = status === 'ACTIVE' ? 'badge-active' : 'badge-inactive';
                    
                    let imgUrl = 'https://via.placeholder.com/50?text=No+Img';
                    if (product.images && product.images.length > 0) {
                        imgUrl = product.images[0].url || product.images[0].originalUrl || imgUrl;
                    }

                    tbody.innerHTML += `
                        <tr onclick="openModal(${index})">
                            <td><img src="${imgUrl}" class="product-img" alt="Product Image" onerror="this.src='https://via.placeholder.com/50?text=No+Img'"></td>
                            <td>${product.name || 'No Name'}</td>
                            <td>${variation.sellerSku || 'N/A'}</td>
                            <td>${price}</td>
                            <td><span class="${statusBadge}">${status}</span></td>
                        </tr>
                    `;
                });
            } catch (error) {
                tbody.innerHTML = '';
                statusMsg.innerHTML = `Error: ${error.message}`;
            }
        }

        // --- MODAL LOGIC ---
        function openModal(index) {
            const product = window.allProducts[index];
            if(!product) return;
            
            currentProductData = product;
            const variation = product.variations && product.variations[0] ? product.variations[0] : {};
            const bc = variation.businessClients && variation.businessClients[0] ? variation.businessClients[0] : {};

            // Populate text fields
            document.getElementById('modal-title').innerText = product.name || 'Product Details';
            document.getElementById('modal-sid').innerText = product.id || 'N/A';
            document.getElementById('modal-variation-sid').innerText = variation.id || 'N/A';
            
            // Populate form values
            document.getElementById('edit-status').value = bc.status || 'ACTIVE';
            
            if (variation.globalPrice) {
                document.getElementById('edit-price').value = variation.globalPrice.value;
                document.getElementById('edit-currency-label').innerText = variation.globalPrice.currency;
            } else {
                document.getElementById('edit-price').value = '';
                document.getElementById('edit-currency-label').innerText = 'N/A';
            }
            
            // Populate images
            const imgContainer = document.getElementById('modal-images');
            imgContainer.innerHTML = '';
            if (product.images && product.images.length > 0) {
                product.images.forEach(img => {
                    imgContainer.innerHTML += `<img src="${img.url}" onerror="this.style.display='none'">`;
                });
            } else {
                imgContainer.innerHTML = '<p>No images available.</p>';
            }

            // Hide alerts
            document.getElementById('modal-alert').style.display = 'none';

            // Show modal
            document.getElementById('product-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('product-modal').style.display = 'none';
            currentProductData = null;
        }

        async function saveChanges() {
            if(!currentProductData) return;

            const variation = currentProductData.variations[0];
            const bc = variation.businessClients[0];
            
            const newStatus = document.getElementById('edit-status').value;
            const newPrice = document.getElementById('edit-price').value;
            
            const alertBox = document.getElementById('modal-alert');
            alertBox.style.display = 'block';
            alertBox.className = 'alert-box'; // reset
            alertBox.innerText = 'Saving changes to Jumia...';

            try {
                // Update Price if changed
                if (newPrice && variation.globalPrice && Number(newPrice) !== variation.globalPrice.value) {
                    const priceRes = await fetch('/api/products/update-price', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${API_TOKEN}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sellerSku: variation.sellerSku,
                            id: variation.id,
                            category: currentProductData.category?.code,
                            newPrice: newPrice,
                            currency: variation.globalPrice.currency
                        })
                    });
                    if (!priceRes.ok) throw new Error(await priceRes.text());
                }

                // Update Status if changed
                if (newStatus && bc.status !== newStatus) {
                    const statusRes = await fetch('/api/products/update-status', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${API_TOKEN}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            sellerSku: variation.sellerSku,
                            id: variation.id,
                            businessClientCode: bc.code,
                            newStatus: newStatus
                        })
                    });
                    if (!statusRes.ok) throw new Error(await statusRes.text());
                }

                alertBox.className = 'alert-box alert-success';
                alertBox.innerText = 'Successfully updated! (Changes may take a minute to reflect on Jumia).';
                
                // Reload products after 2 seconds to show new data
                setTimeout(() => {
                    closeModal();
                    fetchProductsPage(); // Reload current page
                }, 2000);

            } catch (error) {
                alertBox.className = 'alert-box alert-error';
                alertBox.innerText = `Error: ${error.message}`;
            }
        }

        function updatePaginationUI(data) {
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const indicator = document.getElementById('page-indicator');

            indicator.innerText = `Page ${currentPage}`;
            btnPrev.disabled = currentPage === 1;

            if (data.nextToken) {
                btnNext.disabled = false;
                nextTokens[currentPage] = data.nextToken; 
            } else {
                btnNext.disabled = true;
            }
        }

        function loadProducts() {
            currentPage = 1;
            nextTokens = [];
            fetchProductsPage();
        }

        function nextPage() {
            const tokenForNextPage = nextTokens[currentPage];
            if (tokenForNextPage) {
                currentPage++;
                fetchProductsPage(tokenForNextPage);
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                const tokenForPrevPage = currentPage === 1 ? null : nextTokens[currentPage - 1];
                fetchProductsPage(tokenForPrevPage);
            }
        }

        function handleSearchEnter(e) {
            if (e.key === 'Enter') loadProducts();
        }

        function clearFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('search-type').value = 'name';
            loadProducts();
        }

        if (API_TOKEN) { loadShops(); }
    </script>
</body>
</html>
